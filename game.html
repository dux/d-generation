<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>D/Generation</title>
    <style>
      :root {
        color-scheme: dark;
        font: 13px/1.4 ui-monospace, Menlo, monospace;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: #000;
        color: #c8c8d4;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 12px;
      }
      h1 {
        margin: 0 auto 0 0;
        font-size: inherit;
        font-weight: bold;
        color: #e8e8f0;
      }
      button {
        font: inherit;
        color: inherit;
        background: #17171f;
        border: 1px solid #2c2c3a;
        border-radius: 4px;
        padding: 4px 10px;
      }
      /* The canvas is scaled by whole device pixels to fit this box (./src/game/host/host.ts). */
      #box {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      canvas {
        image-rendering: pixelated;
        display: block;
        background: #000;
      }
      #status {
        padding: 6px 12px;
        color: #8a8a9a;
        min-height: 1.4em;
      }
      #stopped {
        margin: 8px 12px;
        padding: 8px 12px;
        border: 1px solid #b04a4a;
        border-radius: 4px;
        background: #3a1414;
        color: #ffb0b0;
        font-weight: bold;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>D/Generation</h1>
      <button id="save" type="button" title="Save state (F5)">Save</button>
      <button id="restore" type="button" title="Restore state (F9)">Restore</button>
      <button id="sound" type="button">Sound: on</button>
    </header>
    <div id="box"><canvas id="game"></canvas></div>
    <div id="stopped" role="alert" hidden></div>
    <div id="status"></div>
    <script type="module" src="/src/game-page.ts"></script>
  </body>
</html>
