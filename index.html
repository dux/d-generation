<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>D/Generation viewer</title>
    <style>
      :root {
        color-scheme: dark;
        font: 13px/1.4 ui-monospace, Menlo, monospace;
      }
      body {
        margin: 0;
        background: #0b0b10;
        color: #c8c8d4;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 10px 14px;
        border-bottom: 1px solid #23232e;
      }
      header .tabs {
        display: flex;
        gap: 2px;
        margin-right: 8px;
      }
      button,
      select {
        font: inherit;
        color: inherit;
        background: #17171f;
        border: 1px solid #2c2c3a;
        border-radius: 4px;
        padding: 4px 10px;
      }
      button[aria-pressed="true"] {
        background: #2a2a6a;
        border-color: #4a4ab0;
      }
      #music {
        margin-left: auto;
      }
      main {
        padding: 14px;
      }
      [hidden] {
        display: none !important;
      }
      /* Play: the page fills the window and the game shrinks to fit it, so the status line stays visible. */
      body.play {
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      body.play main {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      canvas {
        image-rendering: pixelated;
        display: block;
        background: #000;
      }
      #status {
        margin-top: 8px;
        color: #8a8a9a;
        min-height: 1.4em;
      }
      /* Play: the canvas fills this box at the game's aspect ratio (./src/game/host/host.ts). */
      #aga-box {
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
      /* Already drawn at a whole multiple of 320x200; only the final shrink to the box is smoothed. */
      #aga {
        image-rendering: auto;
      }
      #stopped {
        margin-top: 8px;
        padding: 8px 12px;
        border: 1px solid #b04a4a;
        border-radius: 4px;
        background: #3a1414;
        color: #ffb0b0;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="tabs" id="tabs"></div>
      <select id="item" aria-label="Item"></select>
      <select id="palette" aria-label="Palette"></select>
      <button id="save" type="button" title="Save state (F5)" hidden>Save</button>
      <button id="restore" type="button" title="Restore state (F9)" hidden>Restore</button>
      <button id="enhanced" type="button" title="Twice the pixel density (xBR-lv2-noblend)" hidden>Enhanced: off</button>
      <button id="music" type="button">Music: off</button>
    </header>
    <main>
      <canvas id="view"></canvas>
      <div id="aga-box" hidden><canvas id="aga"></canvas></div>
      <div id="stopped" role="alert" hidden></div>
      <div id="status"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
